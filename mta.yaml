_schema-version: 3.3.0
ID: incidentmanagementcapfive
version: 1.0.0-SNAPSHOT
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
modules:
  - name: incidentmanagementcapfive-srv
    type: java
    path: srv
    parameters:
      instances: 1
      buildpack: sap_java_buildpack_jakarta
    properties:
      SPRING_PROFILES_ACTIVE: cloud,sandbox
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 25.+ }'
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
      build-result: target/*-exec.jar
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: incidentmanagementcapfive-auth
      - name: incidentmanagementcapfive-db
      - name: incidentmanagementcapfive-destination

  - name: incidentmanagementcapfive-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
    requires:
      - name: incidentmanagementcapfive-db

  - name: incidentmanagementcapfive-app-deployer
    type: com.sap.application.content
    path: .
    build-parameters:
      build-result: resources
      requires:
        - name: incidentmanagementcapfiveincidentscapfive
          artifacts:
            - incidentscapfive.zip
          target-path: resources
    requires:
      - name: incidentmanagementcapfive-auth
      - name: srv-api
      - name: incidentmanagementcapfive-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: incidentmanagementcapfiveincidentscapfive
    type: html5
    path: app/incidentscapfive
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: incidentmanagementcapfive-destinations
    type: com.sap.application.content
    requires:
      - name: incidentmanagementcapfive-auth
        parameters:
          service-key:
            name: incidentmanagementcapfive-auth-key
      - name: incidentmanagementcapfive-html5-repo-host
        parameters:
          service-key:
            name: incidentmanagementcapfive-html5-repo-host-key
      - name: srv-api
      - name: incidentmanagementcapfive-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: incidentmanagementcapfive-html5-repository
              ServiceInstanceName: incidentmanagementcapfive-html5-repo-host
              ServiceKeyName: incidentmanagementcapfive-html5-repo-host-key
              sap.cloud.service: incidentmanagementcapfive.service
            - Name: incidentmanagementcapfive-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: incidentmanagementcapfive-auth
              ServiceKeyName: incidentmanagementcapfive-auth-key
              sap.cloud.service: incidentmanagementcapfive.service

resources:
  - name: incidentmanagementcapfive-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: incidentmanagementcapfive-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'support (incidentmanagementcapfive ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.support'
          - name: 'admin (incidentmanagementcapfive ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
  - name: incidentmanagementcapfive-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: incidentmanagementcapfive-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: incidentmanagementcapfive-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
